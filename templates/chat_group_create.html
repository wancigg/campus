{% extends "base.html" %}
{% block title %}创建群聊 - 校桥{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto px-4 sm:px-6 lg:px-8 py-12 animate-slide-up">
    <div class="flex items-center mb-6">
        <a href="{{ url_for('chat.list') }}" class="text-gray-400 hover:text-gray-600 mr-3">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </a>
        <h1 class="text-2xl font-bold text-gray-900">创建群聊</h1>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <form method="POST" action="{{ url_for('chat.group_create') }}">
            <div class="mb-5">
                <label class="block text-sm font-medium text-gray-700 mb-1.5">群聊名称 <span class="text-red-400">*</span></label>
                <input type="text" name="name" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-500 outline-none" placeholder="如：项目讨论组、宿舍群">
            </div>

            <div class="mb-5">
                <label class="block text-sm font-medium text-gray-700 mb-2">选择好友 <span class="text-red-400">*</span> <span class="text-gray-400 font-normal">（至少选择 2 位）</span></label>
                {% if friends %}
                <div class="max-h-60 overflow-y-auto border border-gray-200 rounded-xl p-2 space-y-1">
                    {% for f in friends %}
                    <label class="flex items-center px-3 py-2 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors">
                        <input type="checkbox" name="member_ids" value="{{ f.id }}" class="w-4 h-4 text-green-600 border-gray-300 rounded focus:ring-green-500">
                        <div class="ml-3 flex items-center space-x-2">
                            {% if f.avatar %}
                            <img src="{{ url_for('uploaded_file', key=f.avatar) }}" class="w-7 h-7 rounded-full object-cover">
                            {% else %}
                            <div class="w-7 h-7 bg-gradient-to-br from-blue-400 to-cyan-400 rounded-full flex items-center justify-center text-white text-xs font-bold">{{ f.username[0].upper() }}</div>
                            {% endif %}
                            <span class="text-sm text-gray-700">{{ f.username }}</span>
                        </div>
                    </label>
                    {% endfor %}
                </div>
                <p class="text-xs text-gray-400 mt-1">已选 <span id="selectedCount" class="text-green-600 font-medium">0</span> 位好友</p>
                {% else %}
                <div class="text-center py-8 bg-gray-50 rounded-xl">
                    <p class="text-gray-500 text-sm">暂无好友，先去添加好友吧</p>
                    <a href="{{ url_for('social.discover') }}" class="mt-2 inline-block text-blue-600 text-sm hover:underline">去发现好友 →</a>
                </div>
                {% endif %}
            </div>

            <button type="submit" class="w-full py-2.5 bg-gradient-to-r from-green-500 to-teal-500 text-white font-bold rounded-xl hover:shadow-lg transition-all disabled:opacity-50" {% if not friends %}disabled{% endif %}>创建群聊</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.querySelectorAll('input[name="member_ids"]').forEach(function(cb) {
    cb.addEventListener('change', function() {
        var count = document.querySelectorAll('input[name="member_ids"]:checked').length;
        document.getElementById('selectedCount').textContent = count;
    });
});
</script>
{% endblock %}
