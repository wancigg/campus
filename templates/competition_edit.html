{% extends "base.html" %}
{% block title %}发布招募 - 竞赛组队 - 校桥{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-12 animate-slide-up">
    <h1 class="text-2xl font-bold text-gray-900 mb-8">发布竞赛招募</h1>
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">竞赛名称 *</label>
                <input type="text" name="title" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">竞赛类型 *</label>
                <select name="comp_type" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none">
                    <option value="">请选择类型</option>
                    <option value="学科竞赛">学科竞赛</option>
                    <option value="创新创业">创新创业</option>
                    <option value="文艺体育">文艺体育</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">队伍人数</label>
                <input type="number" name="team_size" min="0" value="0" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none" placeholder="0表示不限人数">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">截止日期</label>
                <input type="date" name="deadline"
                       data-min-date="today"
                       data-date-format="Y-m-d"
                       class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none"
                       placeholder="请选择报名截止日期（不可早于今天）">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">详细描述 *</label>
                <textarea name="description" rows="6" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none resize-none" placeholder="描述竞赛内容、参赛要求、技能需求等..."></textarea>
            </div>
            <button type="submit" class="w-full py-3 bg-gradient-to-r from-orange-500 to-red-500 text-white font-bold rounded-xl hover:shadow-lg transition-all">发布招募</button>
        </form>
    </div>
</div>
{% endblock %}
