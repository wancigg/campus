{% extends "base.html" %}
{% block title %}发帖 - 论坛 - 校桥{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-12 animate-slide-up">
    <h1 class="text-2xl font-bold text-gray-900 mb-8">发布帖子</h1>
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <form method="POST" id="postForm" class="space-y-6">
            <!-- 隐藏字段，存储已上传图片的文件名列表（逗号分隔） -->
            <input type="hidden" name="images" id="imagesField" value="">

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">选择板块 *</label>
                <select name="category_id" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 outline-none">
                    <option value="">请选择板块</option>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.icon }} {{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">标题 *</label>
                <input type="text" name="title" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none" placeholder="输入帖子标题...">
            </div>

            <!-- 图片上传区 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">图片（可选，最多9张）</label>
                <div id="previewContainer" class="flex flex-wrap gap-2 mb-2"></div>
                <div id="uploadArea" class="relative border-2 border-dashed border-gray-300 rounded-xl p-6 text-center hover:border-purple-400 hover:bg-purple-50/30 transition-all cursor-pointer">
                    <input type="file" id="fileInput" accept="image/jpeg,image/png,image/gif,image/webp" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="handleFiles(this.files)">
                    <svg class="w-8 h-8 mx-auto text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    <p class="mt-2 text-sm text-gray-500">点击或拖拽图片到此处上传</p>
                    <p class="text-xs text-gray-400 mt-1">支持 JPG、PNG、GIF、WebP，单张不超过 10MB，整次请求最大 50MB</p>
                </div>
                <p id="uploadStatus" class="text-xs mt-1 hidden"></p>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">内容 *</label>
                <textarea name="content" rows="8" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none resize-none" placeholder="写下你想分享的内容..."></textarea>
            </div>
            <button type="submit" class="w-full py-3 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold rounded-xl hover:shadow-lg transition-all duration-300">发布帖子</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
var uploadedFiles = []; // [{filename: 'xxx.png'}]

function updateImagesField() {
    document.getElementById('imagesField').value = uploadedFiles.map(function(f) { return f.filename; }).join(',');
}

function renderPreviews() {
    var container = document.getElementById('previewContainer');
    container.innerHTML = '';
    uploadedFiles.forEach(function(f, idx) {
        var div = document.createElement('div');
        div.className = 'relative w-20 h-20 rounded-lg overflow-hidden border border-gray-200 group';
        div.innerHTML =
            '<img src="/uploads/' + f.filename + '" class="w-full h-full object-cover">' +
            '<button type="button" onclick="removeImage(' + idx + ')" class="absolute top-0.5 right-0.5 w-5 h-5 bg-black/60 rounded-full flex items-center justify-center text-white opacity-0 group-hover:opacity-100 transition-opacity">' +
                '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>' +
            '</button>';
        container.appendChild(div);
    });
    updateImagesField();

    // 超过9张隐藏上传区
    document.getElementById('uploadArea').style.display = uploadedFiles.length >= 9 ? 'none' : '';
}

function handleFiles(files) {
    if (!files || files.length === 0) return;
    var remaining = 9 - uploadedFiles.length;
    if (remaining <= 0) {
        alert('最多上传 9 张图片');
        return;
    }
    var toUpload = Array.from(files).slice(0, remaining);
    toUpload.forEach(function(file) {
        uploadFile(file);
    });
    // 重置 file input 以便同一文件可重新选择
    document.getElementById('fileInput').value = '';
}

function uploadFile(file) {
    if (file.size > 10 * 1024 * 1024) {
        alert('图片 "' + file.name + '" 超过 10MB，已跳过');
        return;
    }
    var status = document.getElementById('uploadStatus');
    status.classList.remove('hidden');
    status.className = 'text-xs mt-1 text-blue-500';
    status.textContent = '上传中...';

    var formData = new FormData();
    formData.append('file', file);

    fetch('/forum/upload-image', {
        method: 'POST',
        body: formData
    }).then(function(r) {
        if (r.status === 413) {
            return Promise.resolve({ ok: false, error: '请求超过总大小限制（整次请求最大 50 MB）' });
        }
        if (!r.ok) {
            return r.text().then(function(t) {
                try { var j = JSON.parse(t); return j; } catch(e) { return { ok: false, error: '上传失败（' + r.status + '）' }; }
            }).catch(function() { return { ok: false, error: '上传失败（' + r.status + '）' }; });
        }
        return r.json();
    }).then(function(data) {
        if (data.ok) {
            uploadedFiles.push({filename: data.filename});
            renderPreviews();
            status.className = 'text-xs mt-1 text-green-500';
            status.textContent = '上传成功';
        } else {
            status.className = 'text-xs mt-1 text-red-500';
            status.textContent = data.error || '上传失败';
        }
    }).catch(function() {
        status.className = 'text-xs mt-1 text-red-500';
        status.textContent = '网络错误，请重试';
    }).finally(function() {
        setTimeout(function() { status.classList.add('hidden'); }, 2000);
    });
}

function removeImage(idx) {
    var filename = uploadedFiles[idx].filename;
    // 删除服务器文件
    fetch('/forum/remove-image', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({filename: filename})
    });
    uploadedFiles.splice(idx, 1);
    renderPreviews();
}

// 支持拖拽上传
var uploadArea = document.getElementById('uploadArea');
uploadArea.addEventListener('dragover', function(e) {
    e.preventDefault();
    uploadArea.classList.add('border-purple-400', 'bg-purple-50');
});
uploadArea.addEventListener('dragleave', function(e) {
    e.preventDefault();
    uploadArea.classList.remove('border-purple-400', 'bg-purple-50');
});
uploadArea.addEventListener('drop', function(e) {
    e.preventDefault();
    uploadArea.classList.remove('border-purple-400', 'bg-purple-50');
    handleFiles(e.dataTransfer.files);
});
</script>
{% endblock %}
